<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1e22;
    --muted: #62666e;
    --rule: #e4e6ea;
    --accent: #c2603a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8eaed;
      --muted: #9aa0aa;
      --rule: #2a2e35;
      --accent: #f0956a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; padding: 64px 24px 96px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 40px; }
  h2 { font-size: 17px; margin: 36px 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 14px; }
  ul { margin: 0 0 14px; padding-left: 22px; }
  li { margin-bottom: 6px; }
  .lede {
    border-left: 3px solid var(--accent);
    padding: 2px 0 2px 16px;
    margin: 0 0 32px;
    font-size: 17px;
  }
  footer {
    margin-top: 56px; padding-top: 20px;
    border-top: 1px solid var(--rule);
    color: var(--muted); font-size: 14px;
  }
  a { color: var(--accent); }
  .button { display:inline-block; padding:10px 18px; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  kbd { font-family: inherit; }
</style>
</head>
<body>
<main>
  <h1>Apps</h1>
  <p class="sub">Support and privacy information</p>

  <h2>Subtitle Blocker</h2>
  <p>Cover subtitles while you watch — a macOS menu bar app for language learners.</p>
  <p><a href="subtitleblocker/support.html">Support</a> · <a href="subtitleblocker/privacy.html">Privacy Policy</a></p>
  <h2>Third Quill</h2>
  <p>Fill, stamp and organize PDFs on your Mac — by hand, or through your AI assistant.</p>
  <p><a href="thirdquill/support.html">Support</a> · <a href="thirdquill/privacy.html">Privacy Policy</a></p>
</main>
</body>
</html>
